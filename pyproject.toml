[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arabizi-compiler"
version = "0.1.0"
description = "A statically typed Arabic-inspired language, compiler, and stack VM"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
arabizi = "arabizi.__main__:main"

[tool.setuptools.packages.find]
include = ["arabizi*"]
